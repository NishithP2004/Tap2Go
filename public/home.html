<body>
    <header>
        <h1>Tap2Go 🚀</h1>
        <em>Tap, verify, and enter!</em>
    </header>
    <main>
        <form class="glass">
            <fieldset name="event-details">
                <legend>Event Details</legend>
                <label for="event-id">Event ID</label>
                <input type="text" name="event-id" placeholder="some-awesome-event" required
                    value="holi-celebrations-25" disabled />
                <br />
                <label for="amount">Amount</label>
                <input type="number" name="amount" value="169" required />
            </fieldset>

            <fieldset>
                <legend>Student Details</legend>
                <label for="student-name">Name</label>
                <input type="text" name="student-name" required placeholder="John Doe" />
                <br />
                <label for="serial-number">Serial Number</label>
                <input type="text" name="serial-number" id="serial-number" required disabled />
                <button type="button" id="scanBtn">Scan <i class="fa-regular fa-id-badge"></i></button>
                <br />
                <!-- <br />
                <label for="student-photo">Photo</label>
                <input type="file" id="student-photo" accept="image/*" capture="user" />
                <button type="button" id="retakeBtn">Retake <i class="fa-solid fa-camera-retro"></i></button>
                <br />
                <img id="photoPreview" width="240" height="240" style="display: none;" /> -->
            </fieldset>
            <!-- <button type="submit" id="writeBtn">Write to Tag <i class="fa-solid fa-pen-to-square"></i></button> -->
            <button type="submit" id="submitBtn">Submit <i class="fa-solid fa-paper-plane"></i></i></button>
            <button type="reset">Reset <i class="fa-solid fa-eraser"></i></button>
        </form>
        <br />
        <button id="verify">Verify <i class="fa-solid fa-certificate"></i></button>
        <button id="logout" onclick="window.open('/logout', '_self')">Logout <i
                class="fa-solid fa-power-off"></i></button>
        <script type="text/javascript">
            const socket = io();

            socket.on("connect", () => {
                console.log("Connected to " + socket.id);
            });

            let scanBtn = document.getElementById("scanBtn")
            let submitBtn = document.getElementById("submitBtn")
            let verifyBtn = document.getElementById("verify")
            let form = document.forms[0];

            scanBtn.addEventListener("click", async (ev) => {
                ev.preventDefault()
                try {
                    const nfcData = await readNFC();

                    document.getElementById("serial-number").value = nfcData.serialNumber
                } catch (err) {
                    log("Error scanning NFC Tag:", err.message)
                }
            })

            /* let photoInput = document.getElementById("student-photo");
            let retakeBtn = document.getElementById("retakeBtn");
            let photoPreview = document.getElementById("photoPreview");

            photoInput.addEventListener("change", (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement("canvas");
                            const ctx = canvas.getContext("2d");
                            canvas.width = 240;
                            canvas.height = 204;
                            ctx.drawImage(img, 0, 0, 240, 204);
                            photoPreview.src = canvas.toDataURL("image/png");
                            photoPreview.style.display = "block";

                }
            });

            retakeBtn.addEventListener("click", () => {

                photoPreview.style.display = "none"; // Hide preview
            }); */

            form.addEventListener("submit", async (ev) => {
                ev.preventDefault();
                const formData = new FormData(form)
                const payload = {
                    eventId: form["event-id"].value,
                    amount: formData.get("amount"),
                    name: formData.get("student-name"),
                    serialNumber: form["serial-number"].value,
                }

                /* log("Sending data to server...")

                socket.emit("generate-jwt", payload, async ({ jwt }) => {
                    log("Tap Card!")
                    await writeNFC([{
                            recordType: "text",
                            data: jwt
                        },
                        {
                            recordType: "mime",
                            mimeType: "image/*",
                            data: photoPreview.src
                        }
                    ])
                   await writeNFC(jwt)
                }) */

                socket.emit("register", payload, res => {
                    if (res.success) {
                        log("Registration Successful!")
                        form.reset()
                    } else {
                        log("Error processing registration: " + res.error)
                    }
                })
            })

            verifyBtn.addEventListener("click", async (ev) => {
                ev.preventDefault();
                try {
                    const nfcData = await readNFC();
                    const payload = {
                        eventId: form["event-id"].value,
                        serialNumber: nfcData.serialNumber
                    }

                    socket.emit("verify", payload, res => {
                        if (res.success && res.verified) {
                            log(`Verified!\nWelcome ${res.data.name}`)
                        } else if(res.success && res.data && res.data.checkedIn) {
                            log(`User already checked in!`)
                        } else {
                            log(`Invalid Registration!`)
                        }
                    })
                } catch (err) {
                    log("Error:", err.message)
                }
            })
        </script>
    </main>
    <footer class="glass">
