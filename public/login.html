<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Tap2Go | Login</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name="theme-color" content="#ff5722">
    <meta name="author" content="Nishith P" />
    <meta name="description" content="Tap, verify and enter!" />
    <link rel='stylesheet' type='text/css' media='screen' href='style.css'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Boldonse&family=Didact+Gothic&family=Fredoka:wght@300..700&family=Poppins&family=Righteous&family=Roboto:ital,wght@0,100..900;1,100..900&family=Sriracha&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://kit.fontawesome.com/50e1c4696b.js" crossorigin="anonymous"></script>
    <script type="text/javascript" src="script.js"></script>
</head>

<body>
    <header>
        <h1>Tap2Go 🚀</h1>
        <em>Tap, verify, and enter!</em>
    </header>
    <main>
        <button id="loginBtn">Authenticate <i class="fa-regular fa-id-badge"></i></button>
        <script type="text/javascript">
            let loginBtn = document.getElementById("loginBtn")
            loginBtn.addEventListener("click", async (ev) => {
                try {
                    const nfcData = await readNFC();

                    document.cookie = `serialNumber=${nfcData.serialNumber}; path=/;`
                    const response = await fetch(`/admin/verify?serialNumber=${nfcData.serialNumber}`, {
                        method: "GET",
                        headers: {
                            "Cookie": document.cookie
                        },
                        credentials: "include"
                    })

                    if (response.ok) {
                        window.location.href = "/home"
                    } else {
                        log("Unauthorised!")
                    }
                } catch (err) {
                    log("Error:", err.message)
                }
            })
        </script>
    </main>
    <footer class="glass">
        Made with ❤️ by <a href="https://nishithp.page">Nishith P</a>
    </footer>
</body>

</html>
