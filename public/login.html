<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Tap2Go</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='style.css'>
    <script type="text/javascript" src="script.js"></script>
</head>

<body>
    <main>
        <h1>Tap2Go</h1>
        <em>Tap, verify, and enter!</em>

        <button id="loginBtn">Authenticate</button>
        <script type="text/javascript">
            let loginBtn = document.getElementById("loginBtn")
            loginBtn.addEventListener("click", async (ev) => {
                try {
                    const nfcData = await readNFC();

                    document.cookie = `serialNumber=${nfcData.serialNumber}; path=/;`
                    const response = await fetch(`/admin/verify?serialNumber=${nfcData.serialNumber}`, {
                        method: "GET",
                        headers: {
                            "Cookie": document.cookie
                        },
                        credentials: "include"
                    })

                    if (response.ok) {
                        window.location.href = "/home"
                    } else {
                        log("Unauthorised!")
                    }
                } catch (err) {
                    log("Error:", err.message)
                }
            })
        </script>
    </main>
    <footer>
        Made with ❤️ by <a href="https://nishithp.page">Nishith P</a>
    </footer>
</body>

</html>
